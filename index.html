<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WiFi Grand-Gbapleu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #0b63ce;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            font-size: 18px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .forfait {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: #0b63ce;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #084c9e;
        }

        #commande {
            display: none;
        }

        .prix {
            font-weight: bold;
            color: #0b63ce;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>WiFi Grand-Gbapleu</h1>
    <p>Internet rapide et illimité</p>
</header>

<div class="container">

    <div class="card">
        <h2>Nos forfaits WiFi</h2>
        <p>Choisissez votre forfait :</p>
    </div>

    <div class="card forfait">
        <div>
            <strong>5 heures</strong><br>
            <span class="prix">200 FCFA</span>
        </div>
        <button onclick="commander('5 heures', 200)">Commander</button>
    </div>

    <div class="card forfait">
        <div>
            <strong>24 heures</strong><br>
            <span class="prix">300 FCFA</span>
        </div>
        <button onclick="commander('24 heures', 300)">Commander</button>
    </div>

    <div class="card forfait">
        <div>
            <strong>3 jours</strong><br>
            <span class="prix">500 FCFA</span>
        </div>
        <button onclick="commander('3 jours', 500)">Commander</button>
    </div>

    <div class="card forfait">
        <div>
            <strong>7 jours</strong><br>
            <span class="prix">1 000 FCFA</span>
        </div>
        <button onclick="commander('7 jours', 1000)">Commander</button>
    </div>

    <div class="card forfait">
        <div>
            <strong>30 jours</strong><br>
            <span class="prix">3 000 FCFA</span>
        </div>
        <button onclick="commander('30 jours', 3000)">Commander</button>
    </div>

    <div class="card" id="commande">
        <h2>Votre commande</h2>

        <p>Forfait : <strong id="forfaitChoisi"></strong></p>
        <p>Prix : <strong id="prixChoisi"></strong> FCFA</p>

        <button onclick="payer()">
            Continuer vers le paiement
        </button>
    </div>

</div>

<footer>
    © 2026 WiFi Grand-Gbapleu
</footer>

<script>
    function commander(forfait, prix) {
        document.getElementById("commande").style.display = "block";

        document.getElementById("forfaitChoisi").textContent = forfait;
        document.getElementById("prixChoisi").textContent = prix;

        document.getElementById("commande").scrollIntoView({
            behavior: "smooth"
        });
    }

    function payer() {
        alert("Étape paiement : nous allons maintenant connecter le système de paiement.");
    }
</script>

</body>
</html>
